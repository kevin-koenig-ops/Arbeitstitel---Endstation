# Baut bei jedem Push auf main eine Android-App (APK) und legt sie unter "Releases" ab.
# Download fürs Handy (immer die neueste):
#   https://github.com/kevin-koenig-ops/Projekt-Heimweg/releases/latest/download/projekt-heimweg.apk
#
# Signiert wird mit einem Test-Schlüssel aus dem Repo (native/android/test-signing.jks).
# Der ist nur zum Testen gedacht. Für den Play Store kommt später ein geheimer Schlüssel.
name: Android-App

on:
  push:
    branches: [main]
    # Nur wenn sich etwas an der App ändert (nicht bei reinen Text-/Konzept-Änderungen)
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'native/**'
      - 'scripts/android-prepare.mjs'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Web-App bauen
        run: |
          npm ci
          npm test
          npm run build

      - name: Android-Projekt erzeugen und anpassen
        run: |
          npx cap add android
          node scripts/android-prepare.mjs ${{ github.run_number }}

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK signieren
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$TOOLS/apksigner" sign --ks native/android/test-signing.jks --ks-key-alias endstation \
            --ks-pass pass:endstation-test --key-pass pass:endstation-test --out projekt-heimweg.apk aligned.apk
          "$TOOLS/apksigner" verify projekt-heimweg.apk
          ls -la projekt-heimweg.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-test --yes --cleanup-tag || true
          gh release create app-test projekt-heimweg.apk \
            --target "${{ github.sha }}" \
            --latest \
            --title "Projekt Heimweg zum Testen (Build ${{ github.run_number }})" \
            --notes "Android-App zum Testen. Am Handy projekt-heimweg.apk antippen, herunterladen und öffnen. Beim ersten Mal fragt Android, ob der Browser Apps installieren darf: erlauben. Neue Builds einfach drüber installieren, der Spielstand bleibt."
